[package]
name = "tauri-plugin-vault-device"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "TheVault's Android device plugin: the Kotlin side and its JNI entry points into the Rust core"
links = "tauri-plugin-vault-device"
# Built with the Android app, in its workspace, not the server's.
workspace = "../../apps/android/src-tauri"

[dependencies]
anyhow = "1"
embedded = { path = "../../crates/embedded" }
jni = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sync = { path = "../../crates/sync" }
tauri = "2.12.4"
tokio = { version = "1", features = ["sync"] }
vocab = { path = "../../crates/vocab" }
writer = { path = "../../crates/writer" }

[dev-dependencies]
base64 = "0.22"
p256 = { version = "0.13", default-features = false, features = ["ecdh"] }
push = { path = "../../crates/push" }
tempfile = "3"
testkit = { path = "../../crates/testkit" }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
