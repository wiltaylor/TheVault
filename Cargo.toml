[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
wcl_lang = { git = "https://github.com/wiltaylor/wcl.git", rev = "0531228286cb19d5b73daf7de23e79790a5e15d4" }
wscript  = { git = "https://github.com/Configweave/wscript.git", rev = "ddb6d9fedc77e68736a1281eaf8a122250f40aa3" }

anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
rustix = { version = "1", features = ["termios", "fs"] }
sha2 = "0.10"
tantivy = "0.26"
pdf-extract = "0.12"
thiserror = "2"
ulid = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

store = { path = "crates/store" }
schema = { path = "crates/schema" }
writer = { path = "crates/writer" }
index = { path = "crates/index" }
state = { path = "crates/state" }
query = { path = "crates/query" }
script = { path = "crates/script" }
script-core = { path = "crates/script-core" }
vocab = { path = "crates/vocab" }
scheduler = { path = "crates/scheduler" }
api = { path = "crates/api" }
embedded = { path = "crates/embedded" }
testkit = { path = "crates/testkit" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Argon2 is unusably slow unoptimised, and every test server checks a password.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
