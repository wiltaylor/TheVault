<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The browser box's monospace font (browser B1): JetBrainsMonoNL Nerd Font Mono, every glyph one
     cell wide and with the Nerd Font icons, so terminal text lines up as it does in the web app. -->
<fontconfig>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMonoNL Nerd Font Mono</family>
    </prefer>
  </alias>
</fontconfig>
