# Publishes the server image and the compose files of a release once its desktop and Android
# builds are on its GitHub Release (D10, ticket 139): the image ghcr.io/wiltaylor/thevault with
# the release's APK, AppImage and static vault CLI builds baked in, and compose.yaml, Caddyfile
# and env.example (deploy/.env.example; GitHub renames an asset with a leading dot) attached to
# the release, where docs/install.md downloads them.
#
# A release is tagged <version>, <major>.<minor>, latest and edge; a pre-release, such as
# 0.1.13-alpha.1, only <version> and edge, so latest and <major>.<minor> only ever name a release
# (scripts/release/image-tags.sh).
#
# The release train (release-train.yml) calls it last, with the version it cut. Run it by hand
# with a tag, such as v0.1.13, to publish an existing release's image again. Either way it writes
# the version into the checkout (scripts/release/stamp.sh), so the server reports it, and
# docker/release-image.sh does the build, check and push; that script runs the same way locally
# without --push. The package follows the repository's visibility, so it stays private while the
# repository is.

name: image

on:
  workflow_call:
    inputs:
      version:
        description: The version the release train cut, X.Y.Z or X.Y.Z-alpha.N
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish again, such as v0.1.13
        required: true

permissions:
  contents: write
  packages: write

# One publish of a version at a time.
concurrency:
  group: image-${{ inputs.version || inputs.tag }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    env:
      # The train passes the version; a run by hand names the tag.
      VERSION_INPUT: ${{ inputs.version }}
      TAG_INPUT: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version != '' && github.sha || format('refs/tags/{0}', inputs.tag) }}

      - name: Write the version into the checkout
        run: |
          if [ -n "$VERSION_INPUT" ]; then version=$VERSION_INPUT; else version=${TAG_INPUT#v}; fi
          scripts/release/stamp.sh "$version"
          {
            echo "VERSION=$version"
            echo "TAG=v$version"
          } >> "$GITHUB_ENV"

      - name: Check the builds are on the release
        run: |
          names=$(gh release view "${TAG}" --json assets -q '.assets[].name' || true)
          missing=""
          for f in "TheVault_${VERSION}_aarch64.apk" "TheVault_${VERSION}_amd64.AppImage" \
            "vault-${VERSION}-linux-x86_64" "vault-${VERSION}-linux-aarch64"; do
            grep -qxF "$f" <<< "$names" || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::release ${TAG} has no${missing}"
            exit 1
          fi

      - name: Download the builds from the release
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "${TAG}" --dir "$RUNNER_TEMP/assets" \
            --pattern "TheVault_${VERSION}_aarch64.apk" \
            --pattern "TheVault_${VERSION}_amd64.AppImage" \
            --pattern "vault-${VERSION}-linux-x86_64" \
            --pattern "vault-${VERSION}-linux-aarch64" \
            --pattern 'SHA256SUMS*'
          # The AppImage's updater signature is on the release only when release.yml signed it.
          gh release download "${TAG}" --dir "$RUNNER_TEMP/assets" \
            --pattern "TheVault_${VERSION}_amd64.AppImage.sig" ||
            echo "release ${TAG} has no updater signature for the AppImage"
          ls -l "$RUNNER_TEMP/assets"

      - name: Log in to the GitHub container registry
        run: docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin <<< "${GH_TOKEN}"

      - name: Build, check and push the image
        run: docker/release-image.sh "$RUNNER_TEMP/assets" --push

      - name: Attach the compose files to the release
        run: |
          cp deploy/.env.example "$RUNNER_TEMP/env.example"
          gh release upload "${TAG}" --clobber "$RUNNER_TEMP/env.example" deploy/Caddyfile
          gh release upload "${TAG}" --clobber deploy/compose.yaml
