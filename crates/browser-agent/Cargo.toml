[package]
name = "browser-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# Every file in tests/ is a module of tests/main.rs: one test binary for the crate.
autotests = false

# The browser box's exec service (browser B2): built statically against musl into the image
# docker/browser.Dockerfile makes, where it runs commands as the desktop user.
[[bin]]
name = "browser-agent"
path = "src/main.rs"

[dependencies]
axum.workspace = true
rustix = { workspace = true, features = ["process"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time", "sync", "fs"] }

[dev-dependencies]
reqwest.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
