[package]
name = "thevault-desktop"
version = "0.1.8"
description = "TheVault's Linux desktop app"
edition = "2024"
license = "MIT"
publish = false

# Its own workspace: the app builds with the Tauri CLI, apart from the server workspace's
# `just check`.
[workspace]

[[bin]]
name = "thevault"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
axum = "0.8"
embedded = { path = "../../../crates/embedded" }
futures-util = "0.3"
# The same glib as GTK's, to name the program before GTK starts (app_menu).
glib = "0.18"
http-body-util = "0.1"
keyring = { version = "3.6", features = ["async-secret-service", "tokio", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sync = { path = "../../../crates/sync" }
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["sync", "time", "macros"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
