# TheVault on Docker Compose. Copy .env.example to .env beside this file, fill it in, then:
#
#   docker compose up -d                        # LAN or Tailscale, http on THEVAULT_PORT
#   docker compose --profile https up -d        # your own domain, Caddy with automatic TLS
#   docker compose --profile cloudflare up -d   # a Cloudflare Tunnel, no ports opened
#
# Add --profile browser to any of these for the browser box, a desktop agents drive a browser in;
# it needs BROWSER_TOKEN in .env.
#
# docs/install.md walks through each one.
name: thevault

services:
  thevault:
    image: ghcr.io/wiltaylor/thevault:${THEVAULT_VERSION:-latest}
    restart: unless-stopped
    # Docker gives containers the DNS servers in the host's /etc/resolv.conf. When that file names
    # none, as on some systemd-resolved hosts, Gmail and Calendar sync fail with "could not
    # connect": uncomment these lines to give the container its own.
    # dns: [1.1.1.1, 8.8.8.8]
    environment:
      # Only read when /data holds no vault yet: the first start creates one with this password.
      VAULT_PASSWORD: ${VAULT_PASSWORD:-}
      TZ: ${TZ:-UTC}
      # The browser box's exec service, set only when .env has BROWSER_TOKEN (browser profile).
      VAULT_BROWSER_URL: ${BROWSER_TOKEN:+http://browser:7700}
      VAULT_BROWSER_TOKEN: ${BROWSER_TOKEN:-}
    networks: [default, browser]
    volumes:
      # Named volumes unless .env names host folders.
      - ${THEVAULT_DATA:-data}:/data
      - ${THEVAULT_CONFIG:-config}:/config
    ports:
      # All interfaces by default. Behind Caddy or a tunnel, set THEVAULT_PORT=127.0.0.1:8080 so
      # only this machine reaches the plain http port.
      - ${THEVAULT_PORT:-8080}:8080
    healthcheck:
      test: ["CMD", "/usr/local/bin/thevault-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    # vault-server shuts down gracefully on SIGINT; the image sets the same.
    stop_signal: SIGINT
    stop_grace_period: 20s

  caddy:
    image: caddy:2
    profiles: [https]
    restart: unless-stopped
    depends_on:
      thevault:
        condition: service_healthy
    environment:
      THEVAULT_DOMAIN: ${THEVAULT_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.10.1}
    profiles: [cloudflare]
    restart: unless-stopped
    depends_on:
      thevault:
        condition: service_healthy
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

  # The browser box (docs/install.md, "Browser box"): an XFCE desktop with playwright-cli and
  # Chromium, which agents with the browser permission drive through its exec service on port
  # 7700. It publishes no ports and shares a network only with thevault, which shows its desktop
  # (noVNC on port 6080) to a logged-in user. It holds no vault data or secrets.
  browser:
    image: ghcr.io/wiltaylor/thevault-browser:${THEVAULT_VERSION:-latest}
    profiles: [browser]
    restart: unless-stopped
    environment:
      BROWSER_TOKEN: ${BROWSER_TOKEN:-}
      TZ: ${TZ:-UTC}
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb
    mem_limit: ${BROWSER_MEMORY:-2g}
    cpus: ${BROWSER_CPUS:-2}
    volumes:
      # Browser profiles, saved logins and the desktop's settings persist here.
      - browser-home:/home/agent
    networks: [browser]

networks:
  default:
  # thevault and the browser box only. Not internal: the box needs the internet.
  browser:

volumes:
  data:
  config:
  caddy-data:
  caddy-config:
  browser-home:
