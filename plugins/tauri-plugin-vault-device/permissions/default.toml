"$schema" = "schemas/schema.json"

[default]
description = "Lets the webview open the capture setup screen, read the capture status, import the phone's history and check for new messages and calls."
permissions = [
  "allow-open-capture-setup",
  "allow-capture-status",
  "allow-import-history",
  "allow-import-status",
  "allow-check-now",
]
