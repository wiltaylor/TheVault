# Builds the Linux desktop release for the release train (release-train.yml, D11, ticket 139):
# the AppImage, deb and rpm, their SHA256SUMS, the AUR thevault-bin PKGBUILD and .SRCINFO for
# that release, and the static vault CLI builds for Linux x86_64 and aarch64 with SHA256SUMS-cli
# (D27), which image.yml bakes into the server image. It writes `version` into the checkout
# first (scripts/release/stamp.sh) and keeps the files as the workflow artifact release-desktop,
# which the train's publish job puts on the GitHub Release. Everything builds in the dev
# container, as it does locally. A pre-release's deb, rpm and AUR package carry the version their
# package managers sort before the release (docs/releasing.md).
#
# The AppImage is signed for the desktop updater (D27) with the key from two repository secrets:
# TAURI_SIGNING_PRIVATE_KEY, the text of the key file `cargo tauri signer generate` wrote, and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD, its password. The release carries the signature as
# TheVault_<version>_amd64.AppImage.sig, which image.yml publishes with the AppImage. Without the
# key the workflow fails rather than release an AppImage installed apps will not update to.

name: release

on:
  workflow_call:
    inputs:
      version:
        description: The version to build, X.Y.Z or X.Y.Z-alpha.N
        type: string
        required: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true

permissions:
  contents: read
  packages: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Write the version into the checkout
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/release/stamp.sh "$VERSION"

      # The dev image carries the Android SDK as well and needs more disk than the runner has free.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # The dev image comes from ghcr.io (dev-image.yml, ticket 138); ./dev builds it only when the
      # pull fails. The log shows the pull and how long it took.
      - name: Pull the dev image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin <<< "${GH_TOKEN}"
          ./dev true

      - name: Check the updater signing key is set
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "${UPDATER_KEY}" ] || missing="$missing TAURI_SIGNING_PRIVATE_KEY"
          [ -n "${UPDATER_KEY_PASSWORD}" ] || missing="$missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::the repository secrets${missing} are not set: without the updater key the AppImage has no signature and installed apps will not update to it (docs/desktop.md)" >&2
            exit 1
          fi

      # ./dev passes the key itself into the container; base64 holds no whitespace, so a newline
      # pasted with the secret is dropped.
      - name: Build the bundles, sign the AppImage and smoke-test it
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: TAURI_SIGNING_PRIVATE_KEY=$(printf '%s' "$UPDATER_KEY" | tr -d '[:space:]') ./dev just desktop-release-test

      - name: Check the AppImage has its updater signature
        run: |
          shopt -s nullglob
          images=(target/desktop-release/*.AppImage)
          if [ ${#images[@]} -eq 0 ]; then
            echo "::error::target/desktop-release has no AppImage" >&2
            exit 1
          fi
          for image in "${images[@]}"; do
            if [ ! -s "$image.sig" ]; then
              echo "::error::$image has no updater signature $image.sig" >&2
              exit 1
            fi
            echo "$image is signed for the updater"
          done

      - name: Write the AUR package for this release
        run: ./dev just aur-release

      - name: Build the static vault CLI for x86_64 and aarch64
        run: |
          ./dev just cli-release
          mv target/cli-release/SHA256SUMS target/cli-release/SHA256SUMS-cli

      - name: Gather the release files
        run: |
          mkdir -p target/release-desktop
          cp target/desktop-release/*.AppImage \
            target/desktop-release/*.AppImage.sig \
            target/desktop-release/*.deb \
            target/desktop-release/*.rpm \
            target/desktop-release/SHA256SUMS \
            target/desktop-release/thevault-bin-aur.tar.gz \
            target/cli-release/vault-*-linux-* \
            target/cli-release/SHA256SUMS-cli \
            target/release-desktop/
          ls -l target/release-desktop

      - name: Keep them for the train's publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop
          path: target/release-desktop/*
          if-no-files-found: error
