; The browser box's processes (browser B1), run as agent: the VNC server on display :1 (listening
; only on localhost), the XFCE desktop on it, noVNC on port 6080 in front of the VNC server, and
; the exec service on port 7700 (browser B2). Every line goes to the container's log.

[supervisord]
nodaemon=true
user=agent
; nodaemon already writes its own log to stdout.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:vnc]
command=/usr/bin/Xtigervnc :1 -geometry %(ENV_BROWSER_GEOMETRY)s -depth 24 -SecurityTypes None -localhost -rfbport 5901 -AlwaysShared -desktop "TheVault browser box"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:desktop]
command=/usr/local/bin/thevault-desktop
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5901
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:agent]
command=/usr/local/bin/browser-agent
priority=40
autorestart=true
; SIGTERM makes it finish the requests it is serving.
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
