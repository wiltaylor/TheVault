# Publishes the browser box image ghcr.io/wiltaylor/thevault-browser of a release (browser B9),
# beside the server image (image.yml), once the release train has published the release.
#
# A release is tagged <version>, <major>.<minor>, latest and edge; a pre-release only <version>
# and edge, as the server image is (scripts/release/image-tags.sh).
#
# The release train (release-train.yml) calls it with the version it cut. Run it by hand with a
# tag, such as v0.1.13, to publish an existing release's browser image again. Either way it writes
# the version into the checkout (scripts/release/stamp.sh), so the exec service reports it, and
# docker/release-browser-image.sh does the build, check and push; that script runs the same way
# locally without --push.

name: browser-image

on:
  workflow_call:
    inputs:
      version:
        description: The version the release train cut, X.Y.Z or X.Y.Z-alpha.N
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish again, such as v0.1.13
        required: true

permissions:
  contents: read
  packages: write

# One publish of a version at a time.
concurrency:
  group: browser-image-${{ inputs.version || inputs.tag }}
  cancel-in-progress: false

jobs:
  browser-image:
    runs-on: ubuntu-24.04
    env:
      VERSION_INPUT: ${{ inputs.version }}
      TAG_INPUT: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version != '' && github.sha || format('refs/tags/{0}', inputs.tag) }}

      - name: Write the version into the checkout
        run: |
          if [ -n "$VERSION_INPUT" ]; then version=$VERSION_INPUT; else version=${TAG_INPUT#v}; fi
          scripts/release/stamp.sh "$version"
          {
            echo "VERSION=$version"
            echo "TAG=v$version"
          } >> "$GITHUB_ENV"

      - name: Log in to the GitHub container registry
        run: docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin <<< "${GH_TOKEN}"

      - name: Build, check and push the image
        run: docker/release-browser-image.sh --push
