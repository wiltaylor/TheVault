[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.12"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
wcl_lang = { git = "https://github.com/wiltaylor/wcl.git", rev = "0531228286cb19d5b73daf7de23e79790a5e15d4" }
wscript  = { git = "https://github.com/Configweave/wscript.git", rev = "ddb6d9fedc77e68736a1281eaf8a122250f40aa3" }

anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
argon2 = "0.5"
base64 = "0.22"
# Decodes the image assets the AI chat reads and scales big ones down (ai D19): only the
# decoders those need.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
chacha20poly1305 = "0.10"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
rustix = { version = "1", features = ["termios", "fs"] }
sha2 = "0.10"
tantivy = "0.26"
pdf-extract = "0.12"
# pdf-extract's own lopdf, as the fallback text extractor. pdf-extract turns its default features off.
lopdf = { version = "0.42", default-features = false }
# The text of Excel and OpenDocument spreadsheet assets (xlsx, xls, ods), for search.
calamine = { version = "0.37", default-features = false }
# The text of Word (docx) assets: their XML parts, read from the zip.
quick-xml = "0.42"
thiserror = "2"
# Expands an event series' recurrence rule into its occurrences (event-series E5).
rrule = "0.14"
ulid = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
# Agent Skills (skills S1, S2): import and export zips with deflate only, and SKILL.md frontmatter.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
yaml-rust2 = { version = "0.13", default-features = false }
# An HTML5 parser and a DOM to walk: the chat's readable page text (ai D27) and imported email
# and event HTML as content blocks (rich-import H1), without its command-line tool.
scraper = { version = "0.29", default-features = false }

store = { path = "crates/store" }
schema = { path = "crates/schema" }
writer = { path = "crates/writer" }
index = { path = "crates/index" }
state = { path = "crates/state" }
query = { path = "crates/query" }
query-syntax = { path = "crates/query-syntax" }
script = { path = "crates/script" }
script-core = { path = "crates/script-core" }
vocab = { path = "crates/vocab" }
html-blocks = { path = "crates/html-blocks" }
scheduler = { path = "crates/scheduler" }
ai = { path = "crates/ai" }
api = { path = "crates/api" }
clients = { path = "crates/clients" }
embedded = { path = "crates/embedded" }
push = { path = "crates/push" }
sync = { path = "crates/sync" }
testkit = { path = "crates/testkit" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Line tables only: backtraces keep their files and lines, while each linked test binary is a
# fraction of its full-debug size, so `cargo test --workspace` does not saturate the disk with
# linker output. Tests inherit this profile.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Argon2 is unusably slow unoptimised, and every test server checks a password.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# The static vault CLI builds the server hands out (`just cli-release`, D27): stripped, and with
# thin LTO, to keep the download small.
[profile.cli]
inherits = "release"
strip = true
lto = "thin"
