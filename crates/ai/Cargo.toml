[package]
name = "ai"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# Every file in tests/ is a module of tests/main.rs: one test binary for the crate.
autotests = false

[dependencies]
base64.workspace = true
futures-util.workspace = true
reqwest.workspace = true
# Verifies the RS256 ID tokens of Sign in with ChatGPT against the issuer's JWKS (ai D8).
ring = "0.17"
# The readable text of a web page for the chat's fetch_url (ai D27).
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
state.workspace = true
tokio = { workspace = true, features = ["time", "fs", "io-util"] }
ulid.workspace = true

[dev-dependencies]
tempfile.workspace = true
testkit.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
