# Builds the signed Android APK for the release train (release-train.yml, D10, ticket 139), whose
# publish job puts it on the GitHub Release, where adb or Obtainium picks it up. It writes
# `version` into the checkout first (scripts/release/stamp.sh), which sets the APK's versionName
# and its versionCode (scripts/release/version-code.sh). The APK builds in the dev container, as
# it does locally.
#
# Two jobs run side by side: build makes the aarch64 APK and keeps it as the workflow artifact
# release-android, and smoke (android-smoke-reusable.yml) runs `just android-release-smoke` on the
# emulator against a release-signed x86_64 build of the same commit and version. The train's
# publish job needs this whole workflow, so a failed smoke publishes no release, no tag and no
# image.
#
# The keystore never enters the repository. Store it as repository secrets:
#   ANDROID_KEYSTORE_BASE64    the keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its store password
#   ANDROID_KEY_ALIAS          the signing key's alias
#   ANDROID_KEY_PASSWORD       the key's password, when it differs from the store password
# docs/android-release.md describes how to create and back up the keystore.

name: android-release

on:
  workflow_call:
    inputs:
      version:
        description: The version to build, X.Y.Z or X.Y.Z-alpha.N
        type: string
        required: true
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Write the version into the checkout
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/release/stamp.sh "$VERSION"

      # The dev image carries the Android SDK and NDK and needs more disk than the runner has free.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # The dev image comes from ghcr.io (dev-image.yml, ticket 138); ./dev builds it only when the
      # pull fails. The log shows the pull and how long it took.
      - name: Pull the dev image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin <<< "${GH_TOKEN}"
          ./dev true

      - name: Write the keystore from the repository secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build and verify the signed APK
        env:
          THEVAULT_ANDROID_KEYSTORE: ${{ runner.temp }}/release.jks
          THEVAULT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          THEVAULT_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          THEVAULT_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./dev just android-release

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Check the APK's version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          apk="target/android-release/TheVault_${VERSION}_aarch64.apk"
          code=$(scripts/release/version-code.sh "$VERSION")
          # shellcheck disable=SC2016
          badging=$(./dev bash -c '"$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)" dump badging "$1"' _ "$apk")
          badging=$(grep -m 1 '^package:' <<< "$badging")
          echo "$badging"
          grep -q "versionCode='$code' versionName='$VERSION'" <<< "$badging" || {
            echo "::error::$apk is not versionCode $code, versionName $VERSION"
            exit 1
          }
          mv target/android-release/SHA256SUMS target/android-release/SHA256SUMS-android

      - name: Keep the APK for the train's publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            target/android-release/*.apk
            target/android-release/SHA256SUMS-android
          if-no-files-found: error

  smoke:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/android-smoke-reusable.yml
    with:
      release-key: true
      version: ${{ inputs.version }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
