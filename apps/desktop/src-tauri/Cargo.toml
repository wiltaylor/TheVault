[package]
name = "thevault-desktop"
version = "0.1.0"
description = "TheVault's Linux desktop app"
edition = "2024"
license = "MIT"
publish = false

# Its own workspace: the app builds with the Tauri CLI, apart from the server workspace's
# `just check`.
[workspace]

[[bin]]
name = "thevault"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
axum = "0.8"
embedded = { path = "../../../crates/embedded" }
http-body-util = "0.1"
keyring = { version = "3.6", features = ["async-secret-service", "tokio", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sync = { path = "../../../crates/sync" }
tauri = { version = "2.12.4", features = [] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
